title: Patryk Rygiel
name: Patryk Rygiel
description: "Geometric deep learning for science and health. Neural surrogates, cardiovascular imaging, and learning with symmetries."
locale: en-GB
url: "https://patryg99.github.io"
baseurl: "/rygiel-personal-page"
repository: "PatRyg99/rygiel-personal-page"
timezone: Europe/Amsterdam
author:
